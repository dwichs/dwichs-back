  api:
    image: dwichs-api:latest
    hostname: dwichs-api
    stdin_open: true
    tty: true # Keeps the container running for debugging
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
      - .env
    networks:
      - dwichs

  database:
    image: postgres
    hostname: dwichs-database
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: dwichs
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - /docker/container/database/postgresql:/var/lib/postgresql/
    networks:
      - dwichs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20

  # dwichs-prisma-studio:
  #     image: node:22
  #     container_name: dwichs-prisma-studio
  #     ports:
  #       - 5555:5555
  #     restart: unless-stopped
  #     working_dir: /app/prisma
  #     command: npx prisma studio --url="postgresql://admin:admin@dwichs-database:5432/dwichs" --browser none
  #     networks:
  #       - dwichs
  #     volumes:
  #       - ./:/app # Ensures your project files including prisma/ are available

  prisma-studio: 
    hostname: dwichs-prisma-studio
    image: node:lts-alpine3.17
    working_dir: /usr/src/app
    volumes: 
      - ./prisma/:/usr/src/app
    command: npx prisma studio --port 5555 --browser none
    ports: 
      - "5555:5555"
    env_file: 
      - .env.prod
    networks: 
      - dwichs
    # depends_on: 
    #   postgres_db: 
    #     condition: service_healthy // [!code ++]
    #   server: 
    #     condition: service_started // [!code ++]

networks:
  dwichs:
    name: dwichs
    driver: overlay
    attachable: true
